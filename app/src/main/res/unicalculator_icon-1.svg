<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C2FBF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- display screen -->
  <rect x="106" y="96" width="300" height="108" rx="24" fill="#FFFFFF"/>

  <!-- keypad grid: 3 columns x 2 rows, bold and simple -->
  <g fill="#FFFFFF">
    <rect x="106" y="234" width="88" height="88" rx="20"/>
    <rect x="212" y="234" width="88" height="88" rx="20"/>
    <rect x="106" y="330" width="88" height="88" rx="20"/>
    <rect x="212" y="330" width="88" height="88" rx="20"/>
  </g>
  <!-- accent key: the "unify" key -->
  <rect x="318" y="234" width="88" height="184" rx="20" fill="url(#accent)"/>
</svg>
